<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="100%" height="120">
  <defs>
    <style>
      @keyframes barPulse1 { 0%, 100% { transform: scaleY(0.25); } 50% { transform: scaleY(0.92); } }
      @keyframes barPulse2 { 0%, 100% { transform: scaleY(0.85); } 50% { transform: scaleY(0.35); } }
      @keyframes barPulse3 { 0%, 100% { transform: scaleY(0.40); } 50% { transform: scaleY(1.00); } }
      @keyframes barPulse4 { 0%, 100% { transform: scaleY(0.95); } 50% { transform: scaleY(0.20); } }
      @keyframes barPulse5 { 0%, 100% { transform: scaleY(0.30); } 50% { transform: scaleY(0.78); } }
      @keyframes capFloat1 { 0%, 100% { transform: translateY(68px); } 50% { transform: translateY(10px); } }
      @keyframes capFloat2 { 0%, 100% { transform: translateY(18px); } 50% { transform: translateY(60px); } }
      @keyframes capFloat3 { 0%, 100% { transform: translateY(55px); } 50% { transform: translateY(4px); } }
      @keyframes capFloat4 { 0%, 100% { transform: translateY(8px); } 50% { transform: translateY(72px); } }
      @keyframes capFloat5 { 0%, 100% { transform: translateY(62px); } 50% { transform: translateY(22px); } }
      @keyframes rainbowShift { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
      
      .spectrum-group {
        animation: rainbowShift 8s linear infinite;
        transform-origin: center;
      }
      .bar {
        transform-origin: bottom;
      }
      .b1 { animation: barPulse1 1.2s ease-in-out infinite; }
      .b2 { animation: barPulse2 1.5s ease-in-out infinite; }
      .b3 { animation: barPulse3 0.9s ease-in-out infinite; }
      .b4 { animation: barPulse4 1.4s ease-in-out infinite; }
      .b5 { animation: barPulse5 1.1s ease-in-out infinite; }

      .c1 { animation: capFloat1 1.2s ease-in-out infinite; }
      .c2 { animation: capFloat2 1.5s ease-in-out infinite; }
      .c3 { animation: capFloat3 0.9s ease-in-out infinite; }
      .c4 { animation: capFloat4 1.4s ease-in-out infinite; }
      .c5 { animation: capFloat5 1.1s ease-in-out infinite; }
    </style>
    
    <!-- Neon Bar Vertical Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#9333ea" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glass Container Glow -->
    <linearGradient id="boxBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#242a36" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#242a36" />
    </linearGradient>
  </defs>

  <!-- Background Display Frame -->
  <rect x="10" y="8" width="880" height="104" rx="14" fill="#0b0e14" stroke="url(#boxBorder)" stroke-width="1.5" />
  
  <g class="spectrum-group">
    <!-- 32 Animated Spectrum Bars -->
    <!-- Low Bins (Bass) -->
    <rect class="bar b1" x="35" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c1" x="35" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #c084fc)" />

    <rect class="bar b3" x="61" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c3" x="61" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #ec4899)" />

    <rect class="bar b2" x="87" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c2" x="87" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)" />

    <rect class="bar b4" x="113" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c4" x="113" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #c084fc)" />

    <rect class="bar b5" x="139" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c5" x="139" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #ec4899)" />

    <rect class="bar b1" x="165" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c1" x="165" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)" />

    <!-- Mid-Low Bins -->
    <rect class="bar b3" x="191" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c3" x="191" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #c084fc)" />

    <rect class="bar b2" x="217" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c2" x="217" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #ec4899)" />

    <rect class="bar b4" x="243" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c4" x="243" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)" />

    <rect class="bar b1" x="269" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c1" x="269" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #c084fc)" />

    <rect class="bar b5" x="295" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c5" x="295" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #ec4899)" />

    <!-- Center Vocal Bins -->
    <rect class="bar b3" x="321" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c3" x="321" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)" />

    <rect class="bar b2" x="347" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c2" x="347" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #c084fc)" />

    <rect class="bar b4" x="373" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c4" x="373" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #ec4899)" />

    <rect class="bar b1" x="399" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c1" x="399" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)" />

    <rect class="bar b5" x="425" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c5" x="425" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #c084fc)" />

    <rect class="bar b3" x="451" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c3" x="451" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #ec4899)" />

    <rect class="bar b2" x="477" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c2" x="477" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)" />

    <!-- Upper Mids -->
    <rect class="bar b4" x="503" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c4" x="503" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #c084fc)" />

    <rect class="bar b1" x="529" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c1" x="529" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #ec4899)" />

    <rect class="bar b5" x="555" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c5" x="555" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)" />

    <rect class="bar b3" x="581" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c3" x="581" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #c084fc)" />

    <rect class="bar b2" x="607" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c2" x="607" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #ec4899)" />

    <!-- Treble Bins -->
    <rect class="bar b4" x="633" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c4" x="633" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)" />

    <rect class="bar b1" x="659" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c1" x="659" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #c084fc)" />

    <rect class="bar b5" x="685" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c5" x="685" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #ec4899)" />

    <rect class="bar b3" x="711" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c3" x="711" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)" />

    <rect class="bar b2" x="737" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c2" x="737" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #c084fc)" />

    <rect class="bar b4" x="763" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c4" x="763" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #ec4899)" />

    <rect class="bar b1" x="789" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c1" x="789" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)" />

    <rect class="bar b5" x="815" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c5" x="815" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #c084fc)" />

    <rect class="bar b3" x="841" y="15" width="20" height="88" rx="4" fill="url(#barGrad)" />
    <rect class="c3" x="841" y="15" width="20" height="3" rx="1.5" fill="#ffffff" filter="drop-shadow(0 0 4px #ec4899)" />
  </g>
</svg>

