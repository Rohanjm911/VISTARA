<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="100%" height="120">
  <defs>
    <style>
      @keyframes reelSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes projectorGlow { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.65; } }
      @keyframes stripMove { 0% { transform: translateX(0); } 100% { transform: translateX(-160px); } }
      @keyframes neonPulse { 0%, 100% { filter: drop-shadow(0 0 6px #7c3aed); } 50% { filter: drop-shadow(0 0 16px #c084fc); } }

      .reel-cw {
        transform-origin: 65px 60px;
        animation: reelSpin 6s linear infinite;
      }
      .reel-ccw {
        transform-origin: 835px 60px;
        animation: reelSpin 6s linear infinite reverse;
      }
      .projector-beam {
        animation: projectorGlow 3s ease-in-out infinite;
      }
      .film-strip {
        animation: stripMove 4s linear infinite;
      }
      .neon-text {
        animation: neonPulse 2.5s ease-in-out infinite;
      }
    </style>

    <linearGradient id="cinemaBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#121622" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect x="8" y="8" width="884" height="104" rx="14" fill="url(#cinemaBg)" stroke="#242a36" stroke-width="1.5" />

  <!-- Ambient Glow Beam -->
  <ellipse class="projector-beam" cx="450" cy="60" rx="360" ry="45" fill="url(#beamGrad)" />

  <!-- Left Film Reel -->
  <g class="reel-cw">
    <circle cx="65" cy="60" r="38" fill="#141824" stroke="#7c3aed" stroke-width="2.5" />
    <circle cx="65" cy="60" r="14" fill="#0d1017" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Reel Spokes -->
    <line x1="65" y1="26" x2="65" y2="94" stroke="#c084fc" stroke-width="2" />
    <line x1="31" y1="60" x2="99" y2="60" stroke="#c084fc" stroke-width="2" />
    <line x1="41" y1="36" x2="89" y2="84" stroke="#c084fc" stroke-width="2" />
    <line x1="41" y1="84" x2="89" y2="36" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Center Film Track Borders -->
  <line x1="120" y1="24" x2="780" y2="24" stroke="#1f2536" stroke-width="2" stroke-dasharray="12 8" />
  <line x1="120" y1="96" x2="780" y2="96" stroke="#1f2536" stroke-width="2" stroke-dasharray="12 8" />

  <!-- Center Typography & Marquee Badge -->
  <g class="neon-text">
    <text x="450" y="54" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" letter-spacing="4" text-anchor="middle">
      CINEMA UNIVERSE • 4K THEATRICAL
    </text>
  </g>
  <text x="450" y="76" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" letter-spacing="2" text-anchor="middle">
    MULTI-EDITION MATRIX • ADAPTIVE DIRECTSTREAM • ZERO TRANSCODE LOSS
  </text>

  <!-- Golden Quality Badges -->
  <g transform="translate(360, 84)">
    <rect x="-80" y="0" width="70" height="18" rx="4" fill="#181c24" stroke="#fbbf24" stroke-width="1" />
    <text x="-45" y="13" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">1080P/4K</text>

    <rect x="5" y="0" width="70" height="18" rx="4" fill="#181c24" stroke="#38bdf8" stroke-width="1" />
    <text x="40" y="13" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">HEVC/H264</text>

    <rect x="90" y="0" width="70" height="18" rx="4" fill="#181c24" stroke="#a855f7" stroke-width="1" />
    <text x="125" y="13" fill="#a855f7" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">DIRECTPLAY</text>
  </g>

  <!-- Right Film Reel -->
  <g class="reel-ccw">
    <circle cx="835" cy="60" r="38" fill="#141824" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="835" cy="60" r="14" fill="#0d1017" stroke="#7c3aed" stroke-width="1.5" />
    <!-- Reel Spokes -->
    <line x1="835" y1="26" x2="835" y2="94" stroke="#38bdf8" stroke-width="2" />
    <line x1="801" y1="60" x2="869" y2="60" stroke="#38bdf8" stroke-width="2" />
    <line x1="811" y1="36" x2="859" y2="84" stroke="#38bdf8" stroke-width="2" />
    <line x1="811" y1="84" x2="859" y2="36" stroke="#38bdf8" stroke-width="2" />
  </g>
</svg>

