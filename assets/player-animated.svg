<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="modalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a" />
      <stop offset="50%" stop-color="#141926" />
      <stop offset="100%" stop-color="#0a0c12" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <style>
      @keyframes spinDisc {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.4)); }
        50% { opacity: 0.75; filter: drop-shadow(0 0 24px rgba(56, 189, 248, 0.7)); }
      }
      @keyframes progressMove {
        0% { width: 40px; }
        50% { width: 340px; }
        100% { width: 40px; }
      }
      @keyframes barHop1 { 0%, 100% { height: 12px; y: 48px; } 50% { height: 46px; y: 14px; } }
      @keyframes barHop2 { 0%, 100% { height: 38px; y: 22px; } 50% { height: 14px; y: 46px; } }
      @keyframes barHop3 { 0%, 100% { height: 22px; y: 38px; } 50% { height: 50px; y: 10px; } }
      @keyframes lyricGlow {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }

      .spinning-disc {
        transform-origin: 90px 110px;
        animation: spinDisc 7s linear infinite;
      }
      .ambient-disc-glow {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .progress-bar-fill {
        animation: progressMove 16s ease-in-out infinite;
      }
      .mini-bar-1 { animation: barHop1 0.9s ease-in-out infinite; }
      .mini-bar-2 { animation: barHop3 1.2s ease-in-out infinite; }
      .mini-bar-3 { animation: barHop2 0.8s ease-in-out infinite; }
      .mini-bar-4 { animation: barHop1 1.3s ease-in-out infinite; }
      .mini-bar-5 { animation: barHop3 1.0s ease-in-out infinite; }
      .lyric-card { animation: lyricGlow 3s ease-in-out infinite; transform-origin: 430px 115px; }
    </style>
  </defs>

  <!-- Player Shell Container -->
  <rect x="2" y="2" width="846" height="216" rx="18" fill="url(#modalBg)" stroke="#232a3d" stroke-width="1.6" />

  <!-- ================= LEFT: ROTATING VINYL DISC ================= -->
  <!-- Ambient Disc Glow -->
  <circle cx="90" cy="110" r="70" fill="#7c3aed" class="ambient-disc-glow" />

  <!-- Disc -->
  <g class="spinning-disc">
    <circle cx="90" cy="110" r="68" fill="#0d1017" stroke="#252d40" stroke-width="2" />
    <circle cx="90" cy="110" r="58" fill="none" stroke="#181e2b" stroke-width="1" stroke-dasharray="10 4" />
    <circle cx="90" cy="110" r="48" fill="none" stroke="#222b3d" stroke-width="1.2" stroke-dasharray="14 5" />
    <circle cx="90" cy="110" r="38" fill="none" stroke="#19202f" stroke-width="1" stroke-dasharray="8 3" />
    <circle cx="90" cy="110" r="28" fill="url(#neonGlow)" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="90" cy="110" r="7" fill="#0a0c12" stroke="#ffffff" stroke-width="1.2" />
    <path d="M 90 42 L 90 68" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
    <path d="M 90 152 L 90 178" stroke="#ffffff" stroke-width="1.5" opacity="0.3" stroke-linecap="round" />
  </g>

  <!-- ================= CENTER: TRACK DETAILS & CONTROLS ================= -->
  <g transform="translate(185, 28)">
    <!-- Now Playing Tag -->
    <rect x="0" y="0" width="118" height="20" rx="10" fill="#2e1065" stroke="#7c3aed" stroke-width="1" />
    <circle cx="12" cy="10" r="3.5" fill="#a855f7" />
    <text x="24" y="14" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">NOW PLAYING</text>

    <!-- Track Title -->
    <text x="0" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800">
      100 <tspan fill="#a855f7" font-size="14" font-weight="600">• Dave Rodgers</tspan>
    </text>

    <!-- Album & Format Pill -->
    <text x="0" y="68" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">
      Super Eurobeat Vol. 100 • 24-bit / 96 kHz FLAC • Stereo
    </text>

    <!-- Progress Timeline -->
    <g transform="translate(0, 84)">
      <!-- Track Duration Baseline -->
      <rect x="0" y="0" width="370" height="6" rx="3" fill="#1e2433" />
      <!-- Animated Active Track Fill -->
      <rect class="progress-bar-fill" x="0" y="0" width="180" height="6" rx="3" fill="url(#trackGrad)" />
      <!-- Time Labels -->
      <text x="0" y="20" fill="#94a3b8" font-family="monospace" font-size="10.5">01:42</text>
      <text x="370" y="20" fill="#64748b" font-family="monospace" font-size="10.5" text-anchor="end">03:58</text>
    </g>

    <!-- Playback Controls Representation -->
    <g transform="translate(130, 122)">
      <!-- Prev -->
      <path d="M 0 6 L 10 0 L 10 12 Z M 10 6 L 20 0 L 20 12 Z" fill="#94a3b8" />
      <!-- Play/Pause Glow Circle -->
      <circle cx="50" cy="6" r="16" fill="#7c3aed" stroke="#c084fc" stroke-width="1.5" />
      <rect x="45" y="-1" width="3.5" height="14" rx="1.5" fill="#ffffff" />
      <rect x="52" y="-1" width="3.5" height="14" rx="1.5" fill="#ffffff" />
      <!-- Next -->
      <path d="M 80 0 L 90 6 L 80 12 Z M 90 0 L 100 6 L 90 12 Z" fill="#94a3b8" />
    </g>
  </g>

  <!-- ================= RIGHT: SYNCED LYRICS PREVIEW CARD ================= -->
  <g transform="translate(585, 22)">
    <!-- Lyrics Card Container -->
    <rect x="0" y="0" width="245" height="176" rx="14" fill="#0d111a" stroke="#252d42" stroke-width="1.2" />

    <!-- Header / Section Pill -->
    <g transform="translate(16, 16)">
      <rect x="0" y="0" width="82" height="18" rx="9" fill="#3b0764" stroke="#9333ea" stroke-width="1" />
      <text x="41" y="13" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">✦ CHORUS</text>
    </g>

    <!-- Lyrics Lines -->
    <g transform="translate(16, 52)">
      <!-- Line 1: Inactive -->
      <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        I wanna show you the light of fire
      </text>

      <!-- Line 2: ACTIVE (Glow Pill + Equalizer) -->
      <g transform="translate(-8, 12)" class="lyric-card">
        <rect x="0" y="0" width="230" height="34" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1.2" />
        <text x="12" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800">
          100, I really wanna be free
        </text>

        <!-- Mini Equalizer inside active line -->
        <g transform="translate(188, -2)">
          <rect class="mini-bar-1" x="0"  y="14" width="3" height="16" rx="1.5" fill="#c084fc" />
          <rect class="mini-bar-2" x="5"  y="10" width="3" height="22" rx="1.5" fill="#38bdf8" />
          <rect class="mini-bar-3" x="10" y="16" width="3" height="14" rx="1.5" fill="#c084fc" />
          <rect class="mini-bar-4" x="15" y="8"  width="3" height="24" rx="1.5" fill="#a855f7" />
          <rect class="mini-bar-5" x="20" y="12" width="3" height="18" rx="1.5" fill="#38bdf8" />
        </g>
      </g>

      <!-- Line 3: Inactive -->
      <text x="0" y="68" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        It's like a sun into your life...
      </text>

      <!-- Line 4: Inactive -->
      <text x="0" y="92" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">
        100, I'm gettin' crazy
      </text>
    </g>
  </g>
</svg>

