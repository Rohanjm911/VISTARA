<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="100%" height="48">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0" />
      <stop offset="15%" stop-color="#7c3aed" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes waveFlow1 {
        0% { transform: translateX(0); }
        100% { transform: translateX(-450px); }
      }
      @keyframes waveFlow2 {
        0% { transform: translateX(0); }
        100% { transform: translateX(450px); }
      }
      .wave1 {
        animation: waveFlow1 12s linear infinite;
      }
      .wave2 {
        animation: waveFlow2 16s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Center Line -->
  <line x1="0" y1="24" x2="900" y2="24" stroke="#1f2536" stroke-width="1" />

  <!-- Animated Sinusoidal Wave 1 -->
  <g class="wave1" opacity="0.85">
    <path d="M 0 24 Q 56 6, 112 24 T 225 24 T 337 24 T 450 24 T 562 24 T 675 24 T 787 24 T 900 24 T 1012 24 T 1125 24 T 1237 24 T 1350 24" 
          fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Animated Sinusoidal Wave 2 (counter-phase) -->
  <g class="wave2" opacity="0.55">
    <path d="M -450 24 Q -394 40, -338 24 T -225 24 T -113 24 T 0 24 T 112 24 T 225 24 T 337 24 T 450 24 T 562 24 T 675 24 T 787 24 T 900 24" 
          fill="none" stroke="url(#waveGrad)" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>

