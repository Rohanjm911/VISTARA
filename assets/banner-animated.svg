<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 170" width="100%" height="170">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d13" />
      <stop offset="50%" stop-color="#121622" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.5" />
    </linearGradient>

    <!-- Spectrum Bar Gradient -->
    <linearGradient id="spectrumGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Vinyl Center Label Gradient -->
    <linearGradient id="vinylCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes eqA { 0%, 100% { height: 16px; y: 96px; } 50% { height: 72px; y: 40px; } }
      @keyframes eqB { 0%, 100% { height: 48px; y: 64px; } 50% { height: 18px; y: 94px; } }
      @keyframes eqC { 0%, 100% { height: 26px; y: 86px; } 50% { height: 80px; y: 32px; } }
      @keyframes eqD { 0%, 100% { height: 64px; y: 48px; } 50% { height: 24px; y: 88px; } }
      @keyframes eqE { 0%, 100% { height: 32px; y: 80px; } 50% { height: 86px; y: 26px; } }

      @keyframes spinVinyl {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes pulseAura {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.05); }
      }

      @keyframes livePulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }

      @keyframes waveScan {
        0% { transform: translateX(-100px); }
        100% { transform: translateX(950px); }
      }

      .spec-bar {
        rx: 3px;
        ry: 3px;
        fill: url(#spectrumGrad);
      }

      .bar-1  { animation: eqA 1.05s ease-in-out infinite; }
      .bar-2  { animation: eqC 1.35s ease-in-out infinite; }
      .bar-3  { animation: eqB 0.85s ease-in-out infinite; }
      .bar-4  { animation: eqE 1.25s ease-in-out infinite; }
      .bar-5  { animation: eqD 0.95s ease-in-out infinite; }
      .bar-6  { animation: eqA 1.15s ease-in-out infinite; }
      .bar-7  { animation: eqC 0.75s ease-in-out infinite; }
      .bar-8  { animation: eqB 1.45s ease-in-out infinite; }
      .bar-9  { animation: eqE 1.10s ease-in-out infinite; }
      .bar-10 { animation: eqD 0.90s ease-in-out infinite; }
      .bar-11 { animation: eqA 1.30s ease-in-out infinite; }
      .bar-12 { animation: eqC 1.00s ease-in-out infinite; }
      .bar-13 { animation: eqB 0.80s ease-in-out infinite; }
      .bar-14 { animation: eqE 1.40s ease-in-out infinite; }
      .bar-15 { animation: eqD 1.15s ease-in-out infinite; }
      .bar-16 { animation: eqA 0.90s ease-in-out infinite; }
      .bar-17 { animation: eqC 1.20s ease-in-out infinite; }
      .bar-18 { animation: eqB 1.05s ease-in-out infinite; }
      .bar-19 { animation: eqE 0.85s ease-in-out infinite; }
      .bar-20 { animation: eqD 1.30s ease-in-out infinite; }

      .vinyl-rotate {
        transform-origin: 75px 85px;
        animation: spinVinyl 6s linear infinite;
      }

      .pulse-aura {
        transform-origin: 75px 85px;
        animation: pulseAura 3s ease-in-out infinite;
      }

      .live-dot {
        transform-origin: 865px 32px;
        animation: livePulse 1.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="916" height="166" rx="20" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.6" />

  <!-- Background Ambient Glow behind vinyl -->
  <circle cx="75" cy="85" r="54" fill="#7c3aed" opacity="0.3" filter="url(#accentGlow)" class="pulse-aura" />

  <!-- ================= VINYL TURNTABLE (LEFT) ================= -->
  <g class="vinyl-rotate">
    <!-- Outer Vinyl Body -->
    <circle cx="75" cy="85" r="52" fill="#0f1118" stroke="#222836" stroke-width="1.5" />
    <!-- Grooves -->
    <circle cx="75" cy="85" r="45" fill="none" stroke="#1a1e2b" stroke-width="1" stroke-dasharray="8 3" />
    <circle cx="75" cy="85" r="38" fill="none" stroke="#252b3d" stroke-width="1" stroke-dasharray="12 4" />
    <circle cx="75" cy="85" r="31" fill="none" stroke="#1d2230" stroke-width="1" stroke-dasharray="6 2" />
    <circle cx="75" cy="85" r="24" fill="none" stroke="#262c3e" stroke-width="1" />
    <!-- Center Label -->
    <circle cx="75" cy="85" r="18" fill="url(#vinylCenter)" stroke="#c084fc" stroke-width="1.5" />
    <!-- Center Spindle Hole -->
    <circle cx="75" cy="85" r="4.5" fill="#080a0f" stroke="#ffffff" stroke-width="1" />
    <!-- Subtle Stylus Shine Line -->
    <path d="M 75 33 L 75 52" stroke="#ffffff" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />
    <path d="M 75 118 L 75 137" stroke="#ffffff" stroke-width="1.2" opacity="0.3" stroke-linecap="round" />
  </g>

  <!-- Tonearm -->
  <g>
    <circle cx="138" cy="46" r="5" fill="#334155" stroke="#64748b" stroke-width="1.2" />
    <path d="M 138 46 L 112 70 L 98 80" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="92" y="78" width="8" height="5" rx="1.5" transform="rotate(-35 96 80)" fill="#c084fc" />
  </g>

  <!-- ================= BRAND & METRICS (CENTER-LEFT) ================= -->
  <g transform="translate(155, 34)">
    <!-- Brand Title -->
    <text x="0" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-weight="900" font-size="24" letter-spacing="2">
      VISTARA <tspan fill="#c084fc" font-size="16" font-weight="700">STUDIO ENGINE</tspan>
    </text>
    <text x="0" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-weight="500" font-size="12" letter-spacing="0.5">
      Local-First • Zero Cloud • Bit-Perfect 60 FPS Multimedia Center
    </text>

    <!-- Mini Feature Badges -->
    <g transform="translate(0, 58)">
      <!-- Badge 1: 10-Band EQ -->
      <rect x="0" y="0" width="88" height="20" rx="10" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1" />
      <text x="44" y="14" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">⚡ 10-BAND EQ</text>

      <!-- Badge 2: LRCLIB Lyrics -->
      <rect x="96" y="0" width="105" height="20" rx="10" fill="#0f2942" stroke="#0284c7" stroke-width="1" />
      <text x="148" y="14" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">♫ LRCLIB SYNCED</text>

      <!-- Badge 3: 4K HDR -->
      <rect x="209" y="0" width="82" height="20" rx="10" fill="#142c1f" stroke="#16a34a" stroke-width="1" />
      <text x="250" y="14" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">✦ 4K HDR MKV</text>

      <!-- Badge 4: Bit-Perfect -->
      <rect x="299" y="0" width="102" height="20" rx="10" fill="#2d1537" stroke="#c026d3" stroke-width="1" />
      <text x="350" y="14" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">🎧 FLAC LOSSLESS</text>
    </g>
  </g>

  <!-- ================= ANIMATED FREQUENCY SPECTRUM (RIGHT) ================= -->
  <g transform="translate(610, 0)">
    <!-- Spectrum Baseline -->
    <line x1="0" y1="114" x2="260" y2="114" stroke="#242c3d" stroke-width="1.5" stroke-linecap="round" />

    <!-- 20 Animated Jumping Equalizer Bars -->
    <rect class="spec-bar bar-1"  x="0"   y="96" width="9" height="16" />
    <rect class="spec-bar bar-2"  x="13"  y="86" width="9" height="26" />
    <rect class="spec-bar bar-3"  x="26"  y="64" width="9" height="48" />
    <rect class="spec-bar bar-4"  x="39"  y="80" width="9" height="32" />
    <rect class="spec-bar bar-5"  x="52"  y="48" width="9" height="64" />
    <rect class="spec-bar bar-6"  x="65"  y="96" width="9" height="16" />
    <rect class="spec-bar bar-7"  x="78"  y="86" width="9" height="26" />
    <rect class="spec-bar bar-8"  x="91"  y="64" width="9" height="48" />
    <rect class="spec-bar bar-9"  x="104" y="80" width="9" height="32" />
    <rect class="spec-bar bar-10" x="117" y="48" width="9" height="64" />
    <rect class="spec-bar bar-11" x="130" y="96" width="9" height="16" />
    <rect class="spec-bar bar-12" x="143" y="86" width="9" height="26" />
    <rect class="spec-bar bar-13" x="156" y="64" width="9" height="48" />
    <rect class="spec-bar bar-14" x="169" y="80" width="9" height="32" />
    <rect class="spec-bar bar-15" x="182" y="48" width="9" height="64" />
    <rect class="spec-bar bar-16" x="195" y="96" width="9" height="16" />
    <rect class="spec-bar bar-17" x="208" y="86" width="9" height="26" />
    <rect class="spec-bar bar-18" x="221" y="64" width="9" height="48" />
    <rect class="spec-bar bar-19" x="234" y="80" width="9" height="32" />
    <rect class="spec-bar bar-20" x="247" y="48" width="9" height="64" />

    <text x="130" y="134" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      60 FPS REALTIME AUDIO SPECTRUM
    </text>
  </g>

  <!-- ================= TOP RIGHT LIVE STATUS INDICATOR ================= -->
  <g>
    <!-- Background Pill -->
    <rect x="765" y="16" width="135" height="24" rx="12" fill="#111622" stroke="#263147" stroke-width="1" />
    <!-- Pulsing Green Dot -->
    <circle cx="780" cy="28" r="4" fill="#22c55e" class="live-dot" />
    <text x="792" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">
      ENGINE ONLINE
    </text>
  </g>
</svg>

