<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141b" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="favLeftWing" x1="16%" y1="20%" x2="48%" y2="86%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="55%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="favRightWing" x1="84%" y1="20%" x2="52%" y2="86%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="favInnerFacet" x1="50%" y1="52%" x2="50%" y2="86%">
      <stop offset="0%" stop-color="#0369A1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#082F49" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="favCoreGlow" cx="50%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Badge -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#favBg)" stroke="#222b3b" stroke-width="2" />

  <!-- Ambient Halo -->
  <circle cx="50" cy="50" r="32" fill="#38BDF8" opacity="0.18" />

  <!-- Orbit Ring -->
  <ellipse cx="50" cy="48" rx="38" ry="12" transform="rotate(-20 50 48)" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 6 22 8" opacity="0.45" />

  <!-- Left Wing -->
  <path d="M 16 22 L 47 85 L 47 52 L 32 22 Z" fill="url(#favLeftWing)" />

  <!-- Right Wing -->
  <path d="M 84 22 L 53 85 L 53 52 L 68 22 Z" fill="url(#favRightWing)" />

  <!-- Inner Keystone -->
  <path d="M 47 52 L 50 85 L 53 52 L 50 48 Z" fill="url(#favInnerFacet)" />

  <!-- Aperture Star Beacon -->
  <polygon points="50,15 57,28 50,41 43,28" fill="url(#favCoreGlow)" />
  <polygon points="50,22 53,28 50,34 47,28" fill="#FFFFFF" />

  <!-- Precision Highlights -->
  <path d="M 16 22 L 32 22 L 47 52" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
  <path d="M 84 22 L 68 22 L 53 52" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
  <line x1="50" y1="56" x2="50" y2="85" stroke="#38BDF8" stroke-width="1.2" opacity="0.8" />
</svg>
