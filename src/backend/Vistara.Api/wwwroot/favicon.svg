<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <radialGradient id="dBg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0c0f1e"/>
      <stop offset="100%" stop-color="#030507"/>
    </radialGradient>
    <linearGradient id="dHolo1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="25%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="75%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="dHolo2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="33%" stop-color="#06b6d4"/>
      <stop offset="66%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="dCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="dRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="dGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dSoftGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="12" y="12" width="488" height="488" rx="120" fill="url(#dBg)"/>

  <!-- Holographic border -->
  <rect x="12" y="12" width="488" height="488" rx="120" fill="none" stroke="url(#dHolo1)" stroke-width="3" opacity="0.85"/>

  <!-- Soft bg bloom -->
  <ellipse cx="256" cy="220" rx="160" ry="120" fill="#818cf8" opacity="0.08" filter="url(#dSoftGlow)"/>

  <!-- Orbit rings -->
  <ellipse cx="256" cy="270" rx="180" ry="45" stroke="url(#dRing)" stroke-width="1.5" fill="none" stroke-dasharray="8 6" transform="rotate(-10 256 270)" opacity="0.6"/>
  <ellipse cx="256" cy="270" rx="210" ry="55" stroke="url(#dHolo2)" stroke-width="1" fill="none" stroke-dasharray="4 12" transform="rotate(10 256 270)" opacity="0.4"/>

  <!-- V shape left -->
  <path d="M 108 118 L 256 386 L 256 238 L 168 118 Z" fill="url(#dHolo1)" opacity="0.88" filter="url(#dGlow)"/>

  <!-- V shape right -->
  <path d="M 404 118 L 256 386 L 256 238 L 344 118 Z" fill="url(#dHolo2)" opacity="0.88" filter="url(#dGlow)"/>

  <!-- Center ridge shine -->
  <path d="M 256 238 L 256 386" stroke="url(#dCenter)" stroke-width="3" opacity="0.9"/>

  <!-- Prismatic top highlight -->
  <path d="M 168 118 L 200 118 L 256 200 L 312 118 L 344 118 L 256 238 Z" fill="url(#dHolo1)" opacity="0.4"/>

  <!-- Top diamond gem -->
  <polygon points="256,70 282,118 256,166 230,118" fill="url(#dHolo2)" filter="url(#dGlow)"/>
  <polygon points="256,88 270,118 256,148 242,118" fill="#ffffff" opacity="0.95"/>

  <!-- Scanlines -->
  <line x1="80" y1="200" x2="432" y2="200" stroke="url(#dHolo1)" stroke-width="0.6" opacity="0.2"/>
  <line x1="80" y1="250" x2="432" y2="250" stroke="url(#dHolo1)" stroke-width="0.6" opacity="0.15"/>
  <line x1="80" y1="300" x2="432" y2="300" stroke="url(#dHolo1)" stroke-width="0.6" opacity="0.1"/>

  <!-- Bottom flare -->
  <ellipse cx="256" cy="390" rx="80" ry="10" fill="url(#dHolo1)" opacity="0.3" filter="url(#dSoftGlow)"/>
</svg>
